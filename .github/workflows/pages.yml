# Publishes the MAPEI iPhone site to GitHub Pages and refreshes Bomond stock every hour.
# Needs repository secrets BOMOND_LOGIN and BOMOND_PASSWORD, and Settings → Pages → Source: GitHub Actions.
name: Site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Two jobs, as in GitHub's own Pages template: deploying from the same job that uploaded
  # the site sometimes fails with "No artifacts named github-pages".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Fetch Bomond stock
        env:
          BOMOND_LOGIN: ${{ secrets.BOMOND_LOGIN }}
          BOMOND_PASSWORD: ${{ secrets.BOMOND_PASSWORD }}
        run: |
          mkdir -p _site
          cp index.html calc.js sellers.js account.js logo.png icon-180.png _site/
          java tools/BomondClient.java "$BOMOND_LOGIN" "$BOMOND_PASSWORD" _site/data.xml
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
